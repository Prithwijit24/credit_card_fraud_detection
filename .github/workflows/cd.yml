name: cd

on:
  push:
    tags:
      - "v*"

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push trainer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.trainer
          push: true
          tags: ghcr.io/${{ github.repository }}/fraud-trainer:${{ github.ref_name }}
      - name: Build and push streaming image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.streaming
          push: true
          tags: ghcr.io/${{ github.repository }}/fraud-streaming:${{ github.ref_name }}

