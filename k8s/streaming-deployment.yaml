apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-streaming
  namespace: fraud-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-streaming
  template:
    metadata:
      labels:
        app: fraud-streaming
    spec:
      containers:
        - name: streaming
          image: ghcr.io/OWNER/REPO/fraud-streaming:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: fraud-config
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
