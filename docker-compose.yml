version: "3.9"

services:
  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:3.7
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"

  namenode:
    image: apache/hadoop:3
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
    ports:
      - "9870:9870"
      - "9000:9000"

  datanode:
    image: apache/hadoop:3
    depends_on:
      - namenode
    command: ["hdfs", "datanode"]

  spark-master:
    image: bitnami/spark:3.5
    environment:
      SPARK_MODE: master
    ports:
      - "7077:7077"
      - "8080:8080"

  spark-worker:
    image: bitnami/spark:3.5
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2

  trainer:
    build:
      context: .
      dockerfile: docker/Dockerfile.trainer
    depends_on:
      - spark-master
    volumes:
      - ./configs:/app/configs
      - ../data:/data:ro
      - ./models:/app/models
      - ./data:/app/data
    command: >
      python scripts/train_model.py --config configs/docker.yaml

  streaming-job:
    build:
      context: .
      dockerfile: docker/Dockerfile.streaming
    depends_on:
      - kafka
      - spark-master
      - trainer
    volumes:
      - ./configs:/app/configs
      - ./models:/app/models
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
    command: >
      python scripts/run_streaming_job.py --config configs/docker.yaml

  producer:
    build:
      context: .
      dockerfile: docker/Dockerfile.streaming
    depends_on:
      - kafka
    volumes:
      - ./configs:/app/configs
      - ../data:/data:ro
    command: >
      python scripts/produce_events.py --config configs/docker.yaml --records 1000 --delay-seconds 0.02
