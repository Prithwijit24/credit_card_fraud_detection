version: "3.9"

services:
  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:3.7
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"

  trainer:
    build:
      context: .
      dockerfile: docker/Dockerfile.trainer
    volumes:
      - ../data:/data:ro
      - ./models:/app/models
      - ./data:/app/data
    command: >
      fraud train --config docker

  streaming-job:
    build:
      context: .
      dockerfile: docker/Dockerfile.streaming
    depends_on:
      - kafka
      - trainer
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: >
      fraud stream --config docker

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on:
      - trainer
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    command: >
      fraud api --config docker --host 0.0.0.0 --port 8000

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    depends_on:
      - api
    environment:
      FRAUD_API_URL: http://api:8000
    ports:
      - "8501:8501"

  producer:
    build:
      context: .
      dockerfile: docker/Dockerfile.streaming
    depends_on:
      - kafka
    volumes:
      - ../data:/data:ro
    command: >
      fraud produce --config docker --records 1000 --delay-seconds 0.02
