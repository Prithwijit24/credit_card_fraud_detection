version: "3.9"

services:
  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:3.7
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"

  trainer:
    build:
      context: .
      dockerfile: docker/Dockerfile.trainer
    volumes:
      - ./configs:/app/configs
      - ../data:/data:ro
      - ./models:/app/models
      - ./data:/app/data
    command: >
      python scripts/train_model.py --config configs/docker.yaml

  streaming-job:
    build:
      context: .
      dockerfile: docker/Dockerfile.streaming
    depends_on:
      - kafka
      - trainer
    volumes:
      - ./configs:/app/configs
      - ./models:/app/models
      - ./data:/app/data
    command: >
      python scripts/run_streaming_job.py --config configs/docker.yaml

  producer:
    build:
      context: .
      dockerfile: docker/Dockerfile.streaming
    depends_on:
      - kafka
    volumes:
      - ./configs:/app/configs
      - ../data:/data:ro
    command: >
      python scripts/produce_events.py --config configs/docker.yaml --records 1000 --delay-seconds 0.02
