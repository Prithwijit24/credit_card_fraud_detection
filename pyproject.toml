[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-card-fraud-detection"
version = "0.1.0"
description = "Production-ready credit card fraud detection pipeline built with Pandas and scikit-learn."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Prithwijit" }
]
dependencies = [
  "ipykernel>=7.2.0",
  "joblib>=1.3.0,<2.0.0",
  "matplotlib>=3.10.9",
  "numpy>=1.26.0,<3.0.0",
  "pandas>=2.1.0,<3.0.0",
  "PyYAML>=6.0.1,<7.0.0",
  "scikit-learn>=1.3.0,<2.0.0",
  "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "ruff>=0.6.8,<0.7.0",
  "mypy>=1.11.0,<2.0.0",
  "types-PyYAML>=6.0.12.20240917",
]
stream = [
  "kafka-python>=2.0.2,<3.0.0",
]
api = [
  "fastapi>=0.100.0,<1.0.0",
  "uvicorn>=0.23.0,<1.0.0",
]

[project.scripts]
fraud-train = "fraud_detection.jobs.train:main"
fraud-stream = "fraud_detection.jobs.streaming:main"
fraud-produce = "fraud_detection.jobs.producer:main"
fraud-api = "fraud_detection.jobs.api:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=fraud_detection --cov-report=term-missing --cov-report=xml"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4"]
ignore = ["S101", "N812"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
